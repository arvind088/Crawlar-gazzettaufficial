name: Scheduled ingestion

# Durable daily ingestion (FR-1.1, FR-1.3, NFR-2).
#
# The application's own @Scheduled jobs are correct, but a free-tier web host
# that sleeps when idle and resets its filesystem on deploy guarantees neither
# that a run happens nor that its output survives. Running ingestion here and
# committing the result makes the schedule dependable and turns "no gaps" into
# an auditable per-day commit history rather than a claim.

on:
  schedule:
    # 06:15 Europe/Rome is 04:15 UTC in summer, 05:15 in winter. GitHub cron is
    # UTC only and has no DST, so this fires at 04:15 UTC year-round; the exact
    # minute does not matter because the watermark decides the window.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      rss_entries:
        description: "Maximum RSS entries to read"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: scheduled-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jena-git-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        # A failing build must not be allowed to commit data.
        run: mvn -B test

      - name: Fetch latest Gazzetta RSS entries
        run: mvn -B "-Dexec.mainClass=it.legislation.source.gazzetta.GazzettaRssUpdateRunner" exec:java
        env:
          GAZZETTA_RSS_URL: "https://www.gazzettaufficiale.it/rss/SG"
          GAZZETTA_RSS_OUTPUT: "data/clean/gazzetta_rss_updates.tsv"
          GAZZETTA_RSS_MAX_ENTRIES: ${{ inputs.rss_entries || '50' }}

      - name: Read the act pages of new laws, decree-laws and legislative decrees
        # The RSS feed drives the crawler: each new act's Gazzetta page is read once
        # (its details are kept in the report) and checked against Layer 1, so the
        # report lists the acts published in the Gazzetta and not yet in Normattiva.
        run: mvn -B -q "-Dexec.mainClass=it.legislation.ingest.GazzettaDiscoveryRunner" exec:java

      # Normattiva is not fetched here. The daily update (DailyUpdateRunner)
      # needs the raw corpus and the store, which live on the application's
      # server, not on GitHub's machines: see ARCHITECTURE.md.

      - name: Commit harvested data
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            jena-git-project/data/rdf/*.ttl \
            jena-git-project/data/clean/*.tsv \
            jena-git-project/data/registry/*.tsv

          if git diff --cached --quiet; then
            echo "No new legislation today; nothing to commit."
            exit 0
          fi

          git commit -m "data: scheduled ingestion $(date -u +%Y-%m-%d)"
          git push
