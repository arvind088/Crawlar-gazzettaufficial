# ---------------------------------------------------------------------------
# Italian Legislation Linked Data Platform
#
# Every setting the application reads is listed here so the configuration is
# reviewable in one place rather than spread across @Value defaults.
# Any value can be overridden by an environment variable in a deployment,
# e.g. LEGAL_ELI_BASE_URI, LEGAL_TDB2_PATH.
# ---------------------------------------------------------------------------

# The domain this platform publishes ELI identifiers on (CONTEXT.md constraint 3).
# Set this to the real deployment host before going public.
legal.eli.base-uri=https://osservatorio-eli.example.it

# Persistent triple store location and system of record (FR-2.1, NFR-1).
# The .ttl files under data/rdf are a bootstrap source read once into this
# store; after that the store owns the data and the files may be removed.
legal.tdb2.path=data/tdb2

# Public read-only SPARQL endpoint (FR-3.1, FR-3.2). Queries are aborted after
# this many seconds so one expensive query cannot hold the endpoint open.
legal.sparql.timeout-seconds=30

# Daily update from Normattiva (DailyUpdateRunner: import, Gazzetta check,
# relations). Off by default: it needs the raw corpus under corpus-root and a
# network Normattiva accepts. Turn it on where both exist, with
# LEGAL_DAILY_UPDATE_ENABLED=true (docs/update-routine-rationale.md section 7).
legal.daily-update.enabled=false
legal.daily-update.cron=0 30 6 * * *
legal.daily-update.zone=Europe/Rome
legal.daily-update.corpus-root=data/raw/normattiva
