intro.title=Esplora la legislazione italiana e i suoi collegamenti
intro.text=Trova leggi e decreti, consulta le versioni disponibili e scopri quali atti ne modificano, abrogano o convertono altri. I dati provengono da Normattiva e gli estremi di pubblicazione sono verificati sulla Gazzetta Ufficiale.
intro.more=Come funziona
search.hint=Prova con il titolo, il numero o il codice redazionale, ad esempio “COVID”, “18/2020” o “20G00034”.
hint.eli=L'ELI è l'indirizzo web permanente di questo atto. “Turtle (RDF)” scarica i suoi dati in un formato leggibile dalle macchine.
hint.versions=Ogni versione è il testo vigente da una certa data. Dopo l'originale, ogni versione è un testo coordinato: comprende le modifiche fatte fino a quella data.
hint.rel.in=Atti che hanno modificato, abrogato o comunque inciso su questo atto, secondo Normattiva.
hint.rel.out=Atti che questo atto modifica, abroga, converte in legge o su cui comunque incide.
hint.conversion=Il decreto-legge è adottato dal Governo nei casi di urgenza e perde efficacia se il Parlamento non lo converte in legge entro 60 giorni.
hint.converts=Questa legge converte questi decreti-legge; “Giorni” conta dalla pubblicazione del decreto a quella della legge.
hint.gazzetta=La Gazzetta Ufficiale è il giornale ufficiale in cui gli atti vengono pubblicati. Gli estremi di ogni atto presi da Normattiva sono confrontati con la sua pagina.
gz.none=Non ancora verificato.
