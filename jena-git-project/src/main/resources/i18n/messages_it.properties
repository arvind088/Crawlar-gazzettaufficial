about.title=Informazioni e aiuto
about.lead=Che cos'è questo portale, da dove vengono i dati, come si usa e quanto ci si può fidare.
about.toc=In questa pagina
about.what.title=Che cos'è questo portale?
about.what.p1=Questo portale mostra la legislazione nazionale italiana come dati aperti collegati. Riunisce leggi, decreti-legge e decreti legislativi, tutte le versioni del loro testo e quali atti ne modificano, abrogano o convertono altri. Ogni atto, versione e file ha un indirizzo web permanente secondo l'European Legislation Identifier (ELI), così persone e programmi possono collegarlo e interrogarlo.
about.what.p2=È un portale dimostrativo, non una fonte ufficiale. Per il testo con valore legale di un atto, fa fede la Gazzetta Ufficiale.
about.sources.title=Da dove vengono i dati?
about.sources.normattiva=Il servizio di dati aperti di Normattiva fornisce ogni atto in XML Akoma Ntoso: il testo originale e ogni versione successiva, la storia dell'atto (quali atti lo hanno modificato, e quando) e l'elenco delle modifiche che l'atto apporta ad altri. Testi, versioni e relazioni vengono tutti da qui.
about.sources.gazzetta=La Gazzetta Ufficiale è il giornale ufficiale in cui gli atti vengono pubblicati. Ogni atto è identificato dal suo ELI della Gazzetta, e tipo, numero, data e data di pubblicazione sono confrontati con la sua pagina sulla Gazzetta.
about.sources.update.title=Aggiornamento quotidiano
about.sources.update=Una volta al giorno il portale chiede a Normattiva gli atti pubblicati o modificati dall'ultimo aggiornamento, li importa, li verifica sulla Gazzetta Ufficiale e ricalcola le relazioni.
about.use.title=Come si usa?
about.use.1=Cerca per titolo, numero o codice, oppure filtra per tipo, anno e stato di conversione.
about.use.2=Apri un atto: i suoi estremi, la pubblicazione in Gazzetta Ufficiale e, per un decreto-legge, se è stato convertito in legge.
about.use.3=Consulta la storia del testo: ogni versione, dalla più recente, con gli atti che l'hanno prodotta.
about.use.4=Segui gli atti collegati: quelli che hanno modificato questo atto e quelli che esso modifica.
about.use.5=Per le tue analisi, scarica l'elenco in CSV, ogni atto in RDF (Turtle), o fai domande in SPARQL.
about.rel.title=Come vengono individuate le relazioni?
about.rel.p1=Le relazioni vengono dai dati di Normattiva, non da una lettura automatica del testo. Si usano tre fonti:
about.rel.history=la storia dell'atto modificato: ogni atto che lo ha modificato, con la data della modifica;
about.rel.changes=l'elenco delle modifiche dell'atto modificante: quali articoli di quale atto modifica, e come (modificato, inserito, sostituito, abrogato);
about.rel.title.rule=il titolo della legge di conversione, che indica il decreto-legge convertito (“Conversione in legge, con modificazioni, del decreto-legge 17 marzo 2020, n. 18”).
about.rel.kinds=La modifica di una parte del testo è indicata come Modifica, l'abrogazione dell'intero atto come Abroga, ogni altro effetto come Incide su. Se un atto compare solo nella storia, il tipo non è noto e la relazione è indicata come Incide su.
about.rel.limits=Limiti
about.rel.limit.1=Le relazioni sono complete quanto i dati di Normattiva: un'omissione o un errore lì si ritrova anche qui.
about.rel.limit.2=Abroga indica sempre l'intero atto. L'abrogazione di singoli articoli è indicata come Modifica.
about.rel.limit.3=Una modifica fatta tramite un terzo atto (per esempio il testo di un decreto modificato dalla legge di conversione di un altro decreto) non è contata come relazione diretta.
about.rel.limit.4=La conversione è individuata solo dal titolo della legge; un decreto-legge senza legge di conversione nel dataset risulta non convertito una volta trascorsi i 60 giorni.
about.rel.limit.5=Gli atti fuori dal dataset compaiono con la loro citazione, senza una pagina propria.
about.rel.verify=Per verificare una relazione, apri l'atto modificato su normattiva.it e guarda “Aggiornamenti all'atto”, oppure leggi l'atto modificante sulla Gazzetta Ufficiale.
about.cov.title=Quanto sono aggiornati e completi i dati?
about.cov.size={0} atti datati dal {1} al {2}, con {3} versioni del testo e {4} relazioni tra atti:
about.cov.update.title=Ultimo aggiornamento
about.cov.updated=I dati sono aggiornati al {0} (ultimo aggiornamento quotidiano riuscito).
about.cov.never=L'aggiornamento quotidiano non è ancora stato eseguito: i dati sono quelli della prima importazione.
about.cov.missing.title=Dati mancanti noti
about.cov.notext={0} atti recenti sono elencati da Normattiva ma inviati senza testo. Non hanno ancora versioni né relazioni e vengono richiesti di nuovo a ogni aggiornamento.
about.cov.gazzetta={0} atti su {1} sono confermati dalla loro pagina sulla Gazzetta Ufficiale. Non ancora confermati:
about.cov.excluded=Non inclusi: decreti del Presidente della Repubblica (DPR), decreti del Presidente del Consiglio dei ministri (DPCM), decreti ministeriali, leggi regionali e atti datati prima del 2020.
about.cov.outside=Gli atti fuori dal dataset compaiono comunque nelle relazioni, con la loro citazione.
about.glossary.title=Glossario
about.glossary.lead=I termini usati in queste pagine, in parole semplici.
glossary.act=Atto
glossary.act.text=Un documento normativo, come una legge, un decreto-legge o un decreto legislativo.
glossary.decree-law=Decreto-legge (D.L.)
glossary.decree-law.text=Un atto che il Governo adotta nei casi di urgenza. Perde efficacia se il Parlamento non lo converte in legge entro 60 giorni dalla pubblicazione (art. 77 della Costituzione).
glossary.version=Versione
glossary.version.text=Il testo di un atto applicabile da una certa data.
glossary.original=Testo originale
glossary.original.text=Il testo di un atto come pubblicato la prima volta sulla Gazzetta Ufficiale.
glossary.consolidated=Testo coordinato
glossary.consolidated.text=Una versione che comprende le modifiche apportate nel tempo.
glossary.relations=Relazione
glossary.relations.text=Un collegamento tra due atti: uno modifica, abroga, converte o incide sull'altro.
glossary.amends=Modifica
glossary.amends.text=Cambia una parte di un altro atto: riscrive, aggiunge o elimina parole, commi o articoli. Qui rientra anche l'abrogazione di singoli articoli.
glossary.repeals=Abroga
glossary.repeals.text=Elimina un altro atto nella sua interezza.
glossary.converts=Converte
glossary.converts.text=Converte un decreto-legge in legge, con o senza modificazioni.
glossary.changes=Incide su
glossary.changes.text=Produce un effetto su un altro atto senza riscriverne il testo, per esempio una sospensione, una deroga o un nuovo termine. Si usa anche quando Normattiva registra una modifica senza indicarne il tipo.
glossary.normattiva=Normattiva
glossary.normattiva.text=La banca dati pubblica della legislazione italiana, con tutte le versioni di ogni atto.
glossary.gazzetta=Gazzetta Ufficiale
glossary.gazzetta.text=Il giornale ufficiale in cui vengono pubblicati gli atti italiani.
glossary.eli=ELI
glossary.eli.text=European Legislation Identifier: un indirizzo web permanente per la legislazione, così ogni atto, versione e file ha un proprio link.
glossary.rdf=RDF
glossary.rdf.text=Un formato scaricabile che rappresenta le informazioni e i loro collegamenti; ogni pagina di un atto lo offre in Turtle.
glossary.sparql=SPARQL
glossary.sparql.text=Un modo per fare domande strutturate sul dataset, nella pagina SPARQL.
