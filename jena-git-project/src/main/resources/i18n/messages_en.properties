about.title=About & Help
about.lead=What this portal is, where its data comes from, how to use it, and how far you can rely on it.
about.toc=On this page
about.what.title=What is this portal?
about.what.p1=This portal shows Italian national legislation as linked open data. It brings together laws, decree-laws and legislative decrees, every version of their text, and which acts amend, repeal or convert others. Every act, version and file has a permanent web address that follows the European Legislation Identifier (ELI), so people and programs can link to it and query it.
about.what.p2=It is a sample portal, not an official source. For the legally valid text of an act, refer to the Gazzetta Ufficiale.
about.sources.title=Where does the data come from?
about.sources.normattiva=Normattiva's open data service provides each act in Akoma Ntoso XML: the original text and every later version, the history of the act (which acts modified it, and when) and the list of changes the act makes to others. The texts, the versions and the relations all come from here.
about.sources.gazzetta=The Gazzetta Ufficiale is the official journal in which acts are published. Each act is identified by its Gazzetta ELI, and its type, number, date and publication date are compared with its Gazzetta page.
about.sources.update.title=Daily update
about.sources.update=Once a day the portal asks Normattiva for the acts published or changed since the last update, imports them, checks them against the Gazzetta Ufficiale and finds their relations again.
about.use.title=How do I use it?
about.use.1=Search by title, number or code, or filter by type, year and conversion status.
about.use.2=Open an act: its details, its publication in the Gazzetta Ufficiale and, for a decree-law, whether it was converted into law.
about.use.3=Explore the history of the text: every version, newest first, with the acts that produced it.
about.use.4=Follow the related acts: those that changed this act, and those it changes.
about.use.5=For your own analysis, download the list as CSV, any act as RDF (Turtle), or ask questions in SPARQL.
about.rel.title=How are relationships identified?
about.rel.p1=Relations come from Normattiva's own records, not from reading the text with a program. Three records are used:
about.rel.history=the history of the changed act: every act that modified it, with the date of the change;
about.rel.changes=the list of changes of the modifying act: which articles of which act it changes, and how (amended, inserted, replaced, repealed);
about.rel.title.rule=the title of a conversion law, which names the decree-law it converts (“Conversione in legge, con modificazioni, del decreto-legge 17 marzo 2020, n. 18”).
about.rel.kinds=A change to part of the text is shown as Amends, the repeal of a whole act as Repeals, and any other effect as Changes. When an act is named only in the history, its kind is not known and the relation is shown as Changes.
about.rel.limits=Limits
about.rel.limit.1=The relations are as complete as Normattiva's records: an omission or an error there appears here too.
about.rel.limit.2=Repeals always means the whole act. Repealing single articles is shown as Amends.
about.rel.limit.3=A change made through a third act (for example a decree's text amended by another decree's conversion law) is not counted as a direct relation.
about.rel.limit.4=A conversion is found only from the law's title; a decree-law with no converting law in the dataset is shown as not converted once its 60 days have passed.
about.rel.limit.5=Acts outside the dataset appear by their citation, without a page of their own.
about.rel.verify=To check a relation yourself, open the changed act on normattiva.it and look at “Aggiornamenti all'atto”, or read the modifying act in the Gazzetta Ufficiale.
about.cov.title=How current and complete is the data?
