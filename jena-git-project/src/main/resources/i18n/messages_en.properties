about.glossary.title=Glossary
about.glossary.lead=The terms used on these pages, in plain words.
glossary.act=Act
glossary.act.text=A legislative document, such as a law, a decree-law or a legislative decree.
glossary.decree-law=Decree-law (D.L.)
glossary.decree-law.text=An act the Government adopts in urgent cases. It lapses unless Parliament converts it into law within 60 days of its publication (art. 77 of the Constitution).
glossary.version=Version
glossary.version.text=The text of an act applicable from a particular date.
glossary.original=Original text
glossary.original.text=The text of an act as first published in the Gazzetta Ufficiale.
glossary.consolidated=Consolidated text
glossary.consolidated.text=A version that incorporates the amendments made over time.
glossary.relations=Relation
glossary.relations.text=A link between two acts: one amends, repeals, converts or changes the other.
glossary.amends=Amends
glossary.amends.text=Changes part of another act: rewrites, adds or removes words, paragraphs or articles. Repealing single articles counts here.
glossary.repeals=Repeals
glossary.repeals.text=Cancels another act as a whole.
glossary.converts=Converts
glossary.converts.text=Converts a decree-law into law, with or without modifications.
glossary.changes=Changes
glossary.changes.text=Affects another act without rewriting its text, for example a suspension, a derogation or a new deadline. Also used when Normattiva records a change without saying its kind.
glossary.normattiva=Normattiva
glossary.normattiva.text=The public database of Italian legislation, with every version of each act.
glossary.gazzetta=Gazzetta Ufficiale
glossary.gazzetta.text=The official journal in which Italian acts are published.
glossary.eli=ELI
glossary.eli.text=European Legislation Identifier: a permanent web address for legislation, so that each act, version and file has its own link.
glossary.rdf=RDF
glossary.rdf.text=A downloadable format that represents information and its connections; each act page offers it as Turtle.
glossary.sparql=SPARQL
glossary.sparql.text=A way to ask structured questions about the dataset, on the SPARQL page.
