intro.title=Explore Italian legislation and its connections
intro.text=Find laws and decrees, explore their available versions, and discover which acts amend, repeal or convert others. Data comes from Normattiva, with publication details checked against the Gazzetta Ufficiale.
intro.more=How it works
search.hint=Try an act title, a number or a publication code, for example “COVID”, “18/2020” or “20G00034”.
hint.eli=The ELI is this act's permanent web address as a piece of legislation. “Turtle (RDF)” downloads its data in a machine-readable format.
hint.versions=Each version is the text in force from a date. After the original, every version is a consolidated text: it includes the amendments made up to that date.
hint.rel.in=Acts that amended, repealed or otherwise changed this act, as recorded by Normattiva.
hint.rel.out=Acts that this act amends, repeals, converts into law or otherwise changes.
hint.conversion=A decree-law is adopted by the Government in urgent cases and lapses unless Parliament converts it into law within 60 days.
hint.converts=This law converts these decree-laws; “Days” counts from the decree's publication to the law's.
hint.gazzetta=The Gazzetta Ufficiale is the official journal where acts are published. Each act's details from Normattiva are compared with its page there.
